<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tofugu</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Tofugu">
<meta name="application-name" content="Tofugu">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#53b5f7">
<style>
:root{--bg:#eef3f7;--ink:#1b2430;--mute:#5d6b7a;--blue:#53b5f7;--deep:#1f7bb8;--card:#fff;--line:#d3dde6}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--ink:#e8eef4;--mute:#92a1b0;--deep:#7cc6fa;--line:#2a3541}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 50px}
header{width:min(100%,460px);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}
select,button{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
select{flex:1;min-width:200px}
button:focus-visible,select:focus-visible,#card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#prog{width:min(100%,460px);color:var(--mute);font-size:14px;margin-bottom:10px}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.scene{perspective:1200px;width:min(92vw,440px)}
#card{position:relative;width:100%;aspect-ratio:1;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;border-radius:14px}
#card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card) center/cover no-repeat;border-radius:14px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;color:#1b2430;overflow:hidden}
.back{transform:rotateY(180deg)}
.big{font-size:clamp(64px,22vw,120px);line-height:1.1}
.big.long{font-size:clamp(30px,10vw,54px)}
.rom{font-size:34px;font-weight:700;color:#1f7bb8}
.row{display:flex;gap:10px;margin-top:16px;width:min(92vw,440px)}
.row button{flex:1;padding:13px 8px;font-weight:600}
#miss{border-color:#d9776b}#got{border-color:#4aa77a}#flip{background:var(--blue);border-color:var(--blue);color:#06293f}
#exp{width:min(92vw,440px);margin-top:14px;display:none;background:var(--card);color:#1b2430;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
#exp.on{display:block}
#exp .h{font-size:28px;font-weight:700;color:#1f7bb8;margin-bottom:4px}
#exp .t{white-space:pre-line;font-size:16px}
.hint{margin-top:16px;color:var(--mute);font-size:13px;text-align:center}
.done{padding:40px 10px;text-align:center}
@media(prefers-reduced-motion:reduce){#card{transition:none}}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--line);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;padding:9px 22px;font-weight:600;color:var(--mute)}
.tab.on{background:var(--blue);color:#06293f}
#stage{display:flex;flex-direction:column;align-items:center;width:100%}
#prog .pr{display:flex;gap:12px;align-items:center}
#back{padding:6px 10px}
#lessons{width:min(100%,680px)}
#lessons h2{font-size:18px;margin:22px 0 10px}
.top,.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pri{background:var(--blue);border-color:var(--blue);color:#06293f;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px;min-height:128px;background:var(--card);color:#1b2430}
.lt .ln{font-size:12px;color:#5d6b7a}
.lt .lk{font-size:18px;color:#1f7bb8;letter-spacing:2px}
.lt .lp{width:100%;height:5px;background:#e3eaf0;border-radius:3px;overflow:hidden;margin-top:auto}
.lt .lp i{display:block;height:100%;background:#4aa77a}
.lt small{color:#5d6b7a}
.lt.locked{background:transparent;border-style:dashed;color:var(--mute)}
.lt.locked .lk,.lt.locked .ln,.lt.locked small{color:var(--mute)}
.lt.new{border-color:var(--blue)}
.lt.done{border-color:#4aa77a}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin:12px 0}
.it{background:var(--card);color:#1b2430;border:1.5px solid var(--blue);border-radius:12px;padding:10px 4px 8px;text-align:center}
.it.new{border-style:dashed;opacity:.8}
.it .k{display:block;font-size:30px;line-height:1.2}.it .k.s{font-size:15px}
.it small{color:#5d6b7a}
.seg{display:flex;gap:2px;padding:4px 8px 0}.seg i{flex:1;height:5px;background:#e3eaf0;border-radius:2px}.seg i.on{background:#4aa77a}
.acts,.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.msg{background:var(--card);color:#1b2430;border-left:4px solid var(--blue);padding:10px 14px;border-radius:8px;margin:12px 0}
.note{color:var(--mute);font-size:13px}
.sl{display:flex;gap:8px;margin:-6px 0 16px;flex-wrap:wrap;justify-content:center}
.sl button{font-size:14px;padding:7px 12px}
#learn{width:min(100%,460px)}
.lr-sw{display:flex;gap:6px;margin-bottom:12px}.lr-sw button{flex:1}.lr-sw .on{background:var(--blue);border-color:var(--blue);color:#06293f;font-weight:600}
.lr-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:46px}
.lr-card{background:var(--card);color:#1b2430;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.lr-card .note{color:#5d6b7a}
.lr-h{font-size:13px;font-weight:700;color:#1f7bb8;margin-bottom:4px}
.lr-badge{min-width:38px;height:38px;border-radius:19px;border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:var(--deep);background:#fff}
.lr-trw{width:min(100%,340px);margin:0 auto}
.lr-trh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;min-height:38px}
.lr-trh .lr-h{margin:0;font-size:14px}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;font-size:22px}.brand img{border-radius:8px}
.ch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;background:var(--card);color:#1b2430}
.ch .n{min-width:30px;height:30px;border-radius:15px;background:#e3f2fd;color:#1f7bb8;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.ch .m{flex:1;min-width:0}.ch .m b{display:block}.ch .m small{color:#5d6b7a;display:block}.ch .s{font-size:12px;color:#5d6b7a;text-align:right;white-space:nowrap}
.ch.cur{border-color:var(--blue);border-width:2px}.ch.fin .n{background:#4aa77a;color:#fff}
.cont{display:block;width:100%;text-align:left;padding:14px;margin-bottom:14px}
.lr-badge.ok{background:#4aa77a;border-color:#4aa77a;color:#fff}
.lr-top{display:flex;align-items:center;gap:14px}
.lr-kana{font-size:88px;line-height:1.1;color:#1b2430}.lr-kana.s{font-size:56px}
.lr-rom{font-size:28px;font-weight:700;color:#1f7bb8}
.lr-img{width:100%;aspect-ratio:2/1;background:#fff center no-repeat;background-size:200% 100%;background-position:100% 0;border-radius:10px;border:1.5px solid var(--line);margin-bottom:12px}
.lr-t{white-space:pre-line}
.lr-box{position:relative;width:100%;aspect-ratio:1;border:2px solid #666;border-radius:10px;background:#fff;touch-action:none;overflow:hidden;background-image:linear-gradient(to right,transparent calc(50% - 1px),#ccc calc(50% - 1px),#ccc calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(to bottom,transparent calc(50% - 1px),#ccc calc(50% - 1px),#ccc calc(50% + 1px),transparent calc(50% + 1px))}
.lr-box canvas{position:absolute;inset:0;width:100%;height:100%}
.lr-box .g{opacity:.17}.lr-box .d{touch-action:none;cursor:crosshair}
.lr-box.win{box-shadow:0 0 0 4px #4aa77a}
.lr-btns{display:flex;gap:8px;margin-top:10px}.lr-btns button{flex:1}
.lr-msg{min-height:22px;text-align:center;font-size:14px;margin-top:8px;color:#5d6b7a}
.lr-nav{display:flex;gap:10px;margin-top:14px}.lr-nav button{flex:1;padding:13px}
.lr-q input{width:100%;font-size:22px;padding:12px;border-radius:10px;border:1.5px solid #b9c7d4;background:#fff;color:#1b2430;margin-top:12px}
.lr-qk{font-size:72px;text-align:center;line-height:1.2;padding:10px 0;word-break:break-all}.lr-qk.long{font-size:38px}
.lr-fb{margin-top:10px;font-weight:600;min-height:24px}.lr-fb.good{color:#2a8a5a}.lr-fb.bad{color:#c2503f}
.lr-chart table{border-collapse:collapse;width:100%;text-align:center;font-size:18px}.lr-chart th,.lr-chart td{border:1px solid var(--line);padding:4px 2px}.lr-chart th{color:#1f7bb8;font-size:13px}
.lr-card p{margin:.5em 0}
</style>
</head>
<body>
<div class="brand"><img src="apple-touch-icon.png" alt="" width="34" height="34" onerror="this.remove()"><b>Tofugu</b></div>
<nav class="tabs"><button class="tab on" data-t="lessons">Lessons</button><button class="tab" data-t="book">Learn</button><button class="tab" data-t="fc">Flashcards</button></nav>
<div class="sl"><button id="saveBtn">Save progress (.json)</button><button id="loadBtn">Load progress</button><input type="file" id="fi" accept=".json,application/json" hidden></div>
<header id="fcBar" hidden>
  <select id="deck" aria-label="Deck"></select>
  <button id="restart">Shuffle &amp; restart</button>
</header>
<div id="lessons"></div>
<div id="learn" hidden></div>
<div id="stage" hidden>
  <div id="prog"><div class="pr"><button id="back" hidden>‹ Back</button><span id="count"></span></div><div class="bar"><i id="fill"></i></div></div>
  <div class="scene"><div id="card" tabindex="0" role="button" aria-label="Flashcard, press space to flip"><div class="face front" id="front"></div><div class="face back" id="back2"></div></div></div>
  <div class="row"><button id="miss">Missed</button><button id="flip">Flip</button><button id="got">Got it</button></div>
  <div id="exp" aria-live="polite"></div>
  <p class="hint" id="hint"></p>
</div>
<script>
const BH='https://files.tofugu.com/articles/japanese/2014-06-30-learn-hiragana/';
const BK='https://files.tofugu.com/articles/japanese/2014-09-03-learn-katakana/';

// kana:romaji:rest-of-image-filename (filename = kana + rest)
const HIRA=`あ:a:.png い:i:.png う:u:.png え:e:.png お:o:.jpg か:ka:-mosquito.png き:ki:.png く:ku:.png け:ke:-kelp.png こ:ko:.png さ:sa:-salsa.jpg し:shi:-sheperds-crook.png す:su:.png せ:se:.png そ:so:-soda.png た:ta:-taco.png ち:chi:-say-cheese.png つ:tsu:-tsunami.jpg て:te:-telescope.png と:to:.png な:na:.jpg に:ni:.jpg ぬ:nu:.jpg ね:ne:.png の:no:.jpg は:ha:.png ひ:hi:.jpg ふ:fu:-fool-hula-hoop.jpg へ:he:.jpg ほ:ho:.png ま:ma:.jpg み:mi:.jpg む:mu:.jpg め:me:.jpg も:mo:.jpg や:ya:-yacht.png ゆ:yu:.png よ:yo:-yo.jpg ら:ra:-rabbit.png り:ri:.png る:ru:.png れ:re:.png ろ:ro:.png わ:wa:-wasp.png を:wo:.png ん:n:.png`;
const KATA=`ア:a:-A.jpg イ:i:-eagle.png ウ:u:-う.png エ:e:-girder.jpg オ:o:-opera.jpg カ:ka:-か.png キ:ki:-key.png ク:ku:-cook.png ケ:ke:-K.png コ:ko:-corners.jpg サ:sa:-sakana.png シ:shi:-she.png ス:su:-superman.png セ:se:-せ.png ソ:so:-sew.png タ:ta:-tacos.png チ:chi:-cheerleader.png ツ:tsu:-two.png テ:te:-telephone-pole.png ト:to:-totem-pole.png ナ:na:-narwhal.jpg ニ:ni:-needles.png ヌ:nu:-noodles.png ネ:ne:-neigh.png ノ:no:-nose.png ハ:ha:-hat.png ヒ:hi:-hehehe.png フ:fu:-flag.png ヘ:he:-へ.png ホ:ho:-holy.png マ:ma:-math-angles.png ミ:mi:-missles.png ム:mu:-moo.png メ:me:-me.png モ:mo:-も.png ヤ:ya:-や.png ユ:yu:-you.png ヨ:yo:-yogi.png ラ:ra:-raptor.png リ:ri:-り.png ル:ru:-routes.png レ:re:-rei.png ロ:ro:-road.png ワ:wa:-what.png ヲ:wo:-woof.png ン:n:-one-eyed-man.png`;

// Explanations (sound + mnemonic), one per line: kana|text
const HN=`あ|Sounds like "ah" (like the a in car). Find the capital A hidden inside it. お has no A in it, which is how you tell the two apart.
い|Sounds like the "ee" in eel. Picture two eels standing upright, mimicking the letter i.
う|Sounds like the "oo" in UNO. Spot the U shape tipped on its side. つ is similar but has no "hat" like う does.
え|Sounds like the "e" in egg. An exotic bird with a feather on its head, laying exotic eggs.
お|Sounds like "oh". Find the letter o twice inside it. あ only has one A, お has the double o. This is where many people trip up.
か|Sounds like "ka" in karma. It looks like a mosquito, and mosquito is か (ka) in Japanese. "Cut it out, darn mosquito!"
き|Sounds like the word "key". It looks like a key. In some fonts the bottom stroke is detached, but it's still ki.
く|Sounds like "coo" in cuckoo. It's the beak of a cuckoo bird popping out to say "ku ku, ku ku!"
け|Sounds like "ke" in kelp. It looks like wiggly kelp.
こ|Sounds like "co" in cohabitating. Two cohabiting worms, or two short cords lying side by side.
さ|Sounds like "sa" in salsa. Two hands stirring a bowl of very thick salsa. In some fonts the bottom stroke is detached.
し|Sounds like "shee" in sheep. First exception kana: it's shi, not si. It looks like a shepherd's crook used to herd sheep.
す|Sounds like "sue". See the swing doing a loop and flinging the kid off, who screams "I'M GONNA SUE SOMEBODY!"
せ|Sounds like "se" in sell. A mouth with a big vampire fang. Someone is trying to sell you vampire teeth because they're so sexy.
そ|Sounds like "so" in soda. It looks like a mouth slurping soda.
た|Sounds like "ta" in taco. A fork, a taco, and a lime garnish.
ち|Sounds like "chee" in cheese. Exception kana: chi, not ti. It looks like the forced smile you make when someone says "cheese" for a photo.
つ|Sounds like "tsu" in tsunami. Exception kana: tsu, not tu. The big swoosh looks like a huge tsunami wave.
て|Sounds like "te" in telescope. A hand-held telescope. Hand is て (te) in Japanese, so a hand-held telescope.
と|Sounds like "to" in toe. A toe with a little nail or splinter stuck in it. Ouch.
な|Sounds like "na" in nachos. A nun praying in front of a cross, asking for nachos because she's craving a snack. The cross in the air is the giveaway.
に|Sounds like "nee" in needle. A needle pulling thread.
ぬ|Sounds like "noo" in noodle. Noodles: smooth, bendable, no sharp corners, plus an extra loop at the bottom. Lookalikes: れ め ね わ.
ね|Sounds like "ne" in Nelly. Nelly the cat: the loop is her tail, and unlike noodle ぬ it has sharp corners on the left. Also ねこ (neko) means cat.
の|Sounds like "no" in nose. A big pig nose, or a "No Smoking" sign (circle with a slash). Pick whichever sticks.
は|Sounds like "ha" in haha. It looks like a capital H plus a lowercase a. H + a = "Ha!"
ひ|Sounds like "he" in heat. He has a big nose. Say it out loud: "He has a big nose."
ふ|Between "f" and "h": fu / hu, like a soft "foo" in fool. A fool dancing with a hula hoop around his neck.
へ|Sounds like "he" in help. It's squat and low like Mt. St. Helens, so it's Helens.
ほ|Sounds like "ho" in "ho ho ho". The left line is a chimney. The right is a mutated Santa with four arms, a snake tail, and no head, saying "ho ho ho".
ま|Sounds like "ma" (mother). What evil magic is this? Your mama has removed her head and doubled her arms.
み|Sounds like "mee" in meet. It looks like the number 21. Who just hit blackjack and turned 21? ME!
む|Sounds like "moo" in mood. A cow going "moooooo".
め|Sounds like "me" in mess. A beautiful eye wearing makeup. め is also the Japanese word for eye. Lookalikes: ぬ ね れ わ.
も|Sounds like "mo" in more. You want to catch more fish, so you add more worms to your hook.
や|Sounds like "ya" in yacht. A yacht with an anchor going down and a little flag on the back. Or the face of a yak.
ゆ|Sounds like "you". A unique fish with a huge eyeball, staring right at YOU.
よ|Sounds like "yo" in yo-yo. It looks like the letters Y and O, and a yo-yo sliding down and back up.
ら|Sounds like "ra" or "la". A rabbit standing and facing left with big droopy ears.
り|Sounds like "ree" or "lee", like reed. Reeds swaying in the wind. (It can also be written without the connection in the middle.)
る|Sounds like "ru" or "loo", like route or loop. Like ろ but with a loop at the end: a crazier route with a loop in it.
れ|Sounds like "re" or "le", like retch. A guy kneeling on the ground retching. The curve at the back is his bent knees. Lookalikes: め わ ぬ ね.
ろ|Sounds like "ro" or "lo", like road. The counterpart to る, but with no loop. Just a plain old road.
わ|Sounds like "wa" in wasabi. A wasp flying straight up, with a sharp straight stinger. Nelly the cat (ね) is chasing it.
を|Sounds exactly like お, but is mostly used as the object particle. Type it as "wo". A chinless guy yells "WHOA!" because someone threw a boomerang into his mouth.
ん|Sounds like the n at the end of "pen". The only single-consonant kana. It looks like a lowercase n. Type "nn".`;
const KN=`ア|It has a deformed capital A in it. Tilt your head sideways and connect the lines.
イ|An eagle standing on the ground or a branch. See its legs and its back curved down like an eagle's.
ウ|It looks a lot like hiragana う, so use that to remember it.
エ|A girder an engineer uses to build buildings. Or an elevator with its doors closed.
オ|An opera singer with his mouth in an o shape, singing "Ohhh!"
カ|Same as hiragana か but missing the little extra line.
キ|Looks like the top part of き, and also like part of a weird key.
ク|A long cook's hat.
ケ|It looks like the letter K.
コ|Two 90 degree corners. The corners tell you it's "ko".
サ|Two fish on a skewer: a small sardine and a bigger salmon. Fish is さかな (sakana) in Japanese.
シ|A smiley face with something wrong: both eyes are sideways and stacked, like a deep-sea fish. She has a very weird face. Horizontal dashes mean face.
ス|Superman's super suit walking in the sky. Where did he go naked?
セ|Very similar to hiragana せ, so use that.
ソ|A needle with a long thread, for sewing. Needles are vertical because you stab them straight down. That separates it from the similar ン.
タ|A kite shaped like a taco. Kite is たこ (tako) in Japanese. A giant taco flying high in the sky.
チ|A cheerleader doing a cheer.
ツ|Two needles with thread (ソ had one). Vertical strokes mean needles, horizontal strokes mean a face (シ). It has TWO needles.
テ|A telephone pole.
ト|A totem pole.
ナ|A majestic narwhal swimming up to the surface.
ニ|Two needles lying on their side, not sewing anything (no thread).
ヌ|Chopsticks grabbing noodles and pulling them out of a bowl.
ネ|A horse jumping a hurdle saying "Neigh!"
ノ|A really long nose.
ハ|A rice paddy hat. You have to connect the pieces, but you can see it.
ヒ|He's laughing "hehehe". Can you see his cheeky grin?
フ|A triangle-shaped flag. Imagine the flagpole. Hooray for the triangle flag!
ヘ|Looks exactly like hiragana へ. If you know one, you know both.
ホ|A holy cross with holy light coming off it.
マ|Look at all those angles, lengths, and measurements. All that math!
ミ|Three missiles flying toward you. Be careful!
ム|A cow's friendly face with its snout. Moo.
メ|An X over someone's eye. め (me) means eye. Meh, I guess they're dead now.
モ|Looks very similar to hiragana も, so use that.
ヤ|Looks just like hiragana や minus a little line.
ユ|You have a hook for a hand. What are you, a pirate?
ヨ|Someone doing yoga. Only a yogi could bend into such a boxy position.
ラ|A raptor wearing sweet sunglasses, like a rapper.
リ|Looks just like hiragana り, or very, very similar.
ル|Two routes you can take: route one and route two.
レ|Rei's beautiful, flowy red hair.
ロ|A road that goes around in a square, never ending. A terrible road, like a 12 year old playing Sim City.
ワ|The question-mark-like shape. Questions often begin with "what", so it's wa.
ヲ|A dog woofing so hard its tongue flies out. "Oh!" you say, startled.
ン|A man with only one eye (man + one). Compare シ: that one is a face with horizontal dashes. Mmnnn.`;

const MAP=s=>Object.fromEntries(s.split('\n').map(l=>{const i=l.indexOf('|');return[l.slice(0,i),l.slice(i+1)]}));
const HNM=MAP(HN),KNM=MAP(KN);
const kata=s=>[...s].map(c=>String.fromCharCode(c.charCodeAt(0)+0x60)).join('');
const hira=s=>[...s].map(c=>String.fromCharCode(c.charCodeAt(0)-0x60)).join('');
const imgs=(s,base,hiraganaDeck)=>s.split(' ').map(x=>{const [k,r,e]=x.split(':');
  const n=hiraganaDeck?HNM[k]:`${k} is the katakana for ${hira(k)} (${r}).\n${KNM[k]}`;
  return{k,r,n,img:base+encodeURI(k+e)}});

// Dakuten / han-dakuten
const DAK=[
 ['かきくけこ','がぎぐげご','ka ki ku ke ko','ga gi gu ge go','Dakuten (゛, the little quotes) turns the K sound into a G sound. It makes a "voiced" sound, where your vocal cords vibrate.','The car ({a}) runs into the guard ({b}) rail.',{}],
 ['さしすせそ','ざじずぜぞ','sa shi su se so','za ji zu ze zo','Dakuten turns the S sound into Z. The exception is し, which becomes じ (ji), not zi. Exceptions breed exceptions.','My saw ({a}) just zapped ({b}) me when I tried to use it.',{1:'じ sounds like "ji", though both ji and zi spellings work when typing.'}],
 ['たちつてと','だぢづでど','ta chi tsu te to','da ji zu de do','Dakuten turns the T sound into D. The exceptions are ち and つ, which become ぢ and づ.','TADA! ({a} turns into {b}, like magic.)',{1:'ぢ is pronounced exactly like じ (ji), but it is used for sounds that came from ち. Type "di" to get it.',2:'づ is pronounced exactly like ず (zu), but it is used for sounds that came from つ. Type "du" to get it.'}],
 ['はひふへほ','ばびぶべぼ','ha hi fu he ho','ba bi bu be bo','Dakuten turns the H sound into B. The H-column is special: it can also take a circle (see the P cards).','You say "hahaha" ({a}) at the bar ({b}) because you have had too much to drink.',{}],
 ['はひふへほ','ぱぴぷぺぽ','ha hi fu he ho','pa pi pu pe po','Han-dakuten (゜, a little circle) turns the H sound into P. It only applies to the H-column, and makes a voiceless sound (vocal cords do not vibrate).','You say "hahaha" ({a}) so much at the bar that someone punches ({b}) you. The little circle is a tiny fist about to punch you.',{}]
];
function dakuten(K){
  const f=K?kata:(x=>x),out=[];
  DAK.forEach(([b,v,br,vr,rule,m,ex])=>{const BR=br.split(' '),VR=vr.split(' ');
    [...v].forEach((c,i)=>{
      const base=b[i];
      const n=`${f(base)} (${BR[i]}) → ${f(c)} (${VR[i]})\n${rule}\nMnemonic for the whole row: ${m.replace('{a}',f(b[0])).replace('{b}',f(v[0]))}`+(ex[i]?`\nNote: ${ex[i]}`:'');
      out.push({t:1,k:f(c),r:VR[i],n});
    });
  });
  return out;
}
// Combination kana
const COMBO=[['き','ki','ky'],['ぎ','gi','gy'],['し','shi','sh'],['じ','ji','jy'],['ち','chi','ch'],['に','ni','ny'],['ひ','hi','hy'],['び','bi','by'],['ぴ','pi','py'],['み','mi','my'],['り','ri','ry']];
const SM=[['ゃ','a'],['ゅ','u'],['ょ','o']];
function combos(K){
  const f=K?kata:(x=>x),out=[];
  const mk=(c,cr,pre,sm,v,extra)=>{
    const res=(pre+v).toUpperCase()+(pre==='jy'?' (or J'+v.toUpperCase()+')':'');
    const r=pre+v+(pre==='jy'?' / j'+v:'');
    const n=`${f(c)} + ${f(sm)} → ${cr.toUpperCase()} + Y${v.toUpperCase()} → ${cr.toUpperCase()}Y${v.toUpperCase()} → ${res}\nDrop the "i" sound from the い-row kana so the two blend into one syllable. The small ${f(sm)} is about half the size of ${f({'ゃ':'や','ゅ':'ゆ','ょ':'よ'}[sm])}.${extra||''}`;
    out.push({t:1,k:f(c)+f(sm),r,n});
  };
  COMBO.forEach(([c,cr,pre])=>SM.forEach(([sm,v])=>mk(c,cr,pre,sm,v)));
  if(K)SM.forEach(([sm,v])=>mk('ぢ','ji','jy',sm,v,'\nヂ is the ち-row version of ジ. If you are typing, write D + Y + '+v.toUpperCase()+' (dy'+v+').'));
  return out;
}

const EXG=[
 ['ヴ is ウ with dakuten. Many Japanese speakers are not used to the V sound, so it comes out as BU. With small vowels it sounds like BW-, close to (but not quite) V.',[['ヴ','vu / bu','ウ → ヴ'],['ヴァ','bwa (va)','V sound'],['ヴィ','bwi (vi)','V sound'],['ヴェ','bwe (ve)','V sound'],['ヴォ','bwo (vo)','V sound']]],
 ['Katakana has no W sounds beyond わ and を, so ウ + a small vowel fills in the gaps.',[['ウィ','wi','like "window"'],['ウェ','we','like "Wednesday"'],['ウォ','wo','like "worry". Type UXO']]],
 ['フ + a small vowel makes all the other F sounds.',[['ファ','fa','like "fax"'],['フィ','fi','like "fish"'],['フェ','fe','like "fence"'],['フォ','fo','like "fox"']]],
 ['ツ + a small vowel. Less common. Used for Italian Z sounds (like mozzarella, モッツァレラ) and Chinese TS / TZ sounds. Use "ts" when typing.',[['ツァ','tsa / tza','Type TSA'],['ツィ','tsi / tzi','Type TSI'],['ツェ','tse / tze','Type TSE'],['ツォ','tso / tzo','Type TSO']]],
 ['These use small vowels with kana that are not from the U-row, to make sounds Japanese did not traditionally have.',[['シェ','she','like "shell"'],['ジェ','je','like "jelly"'],['チェ','che','like "check"'],['トゥ','twu','like "two"'],['ティ','ti','like "party". Type THI'],['ドゥ','dwu','like "dew"'],['ディ','di','like "candy". Type DHI']]]

const EXTRA=EXG.flatMap(([g,l])=>l.map(([k,r,e])=>({t:1,k,r,n:`${k} = ${r.toUpperCase()}  (${e})\n${g}`})));

let tab='lessons',mode='map',cur=0,q=[],total=0,flipped=false,token=0,items=[],li=0,scope='all',stats={ok:0,no:0},pending=false,msg='',last='';

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function setFlip(f){

}

// draws q[0] (front = left half of the image, back = right half)
function renderCurrent(){
  const my=++token;
  card.style.transition='none';setFlip(false);void card.offsetWidth;card.style.transition='';
  const c=q[0];
  front.style.backgroundImage=back.style.backgroundImage='none';
  if(!c){card.style.aspectRatio='4/3';
    front.innerHTML=back.innerHTML='<div class="done"><div class="rom">Deck complete</div><p>Pick another deck or shuffle and restart.</p></div>';return}
  if(c.t){
    card.style.aspectRatio='4/3';
    front.innerHTML=bigHTML(c.k);
    back.innerHTML=`<div class="rom">${esc(c.r)}</div>`;
  }else{
    card.style.aspectRatio='2/1';front.innerHTML=back.innerHTML='';
    const url=`url("${c.img}")`;
    front.style.backgroundImage=url;back.style.backgroundImage=url;
    front.style.backgroundSize=back.style.backgroundSize='200% 100%';
    front.style.backgroundPosition='0 0';back.style.backgroundPosition='100% 0';
    const p=new Image();
    p.referrerPolicy='no-referrer';
    p.onload=()=>{if(my===token)card.style.aspectRatio=(p.naturalWidth/2)+'/'+p.naturalHeight};
    p.onerror=()=>{if(my!==token)return;card.style.aspectRatio='4/3';front.style.backgroundImage=back.style.backgroundImage='none';
      front.innerHTML=bigHTML(c.k);
      back.innerHTML=`<div class="rom">${esc(c.r)}</div><p style="font-size:14px">Couldn't load the mnemonic image. If you're viewing this inside Claude's preview, download the file and open it in your browser. Otherwise try this link: <a href="${c.img}" target="_blank" rel="noreferrer">${esc(decodeURI(c.img.split('/').pop()))}</a></p>`};
    p.src=c.img;

}

}
function missed(){if(!q.length)return;q.push(q.shift());show()}
function got(){if(!q.length)return;q.shift();show()}

function renderMap(){
  mode='map';tab='lessons';layout();
  const ids=Object.keys(P.l).filter(id=>ALL[id]&&lv(id)),n5=ids.filter(id=>lv(id)===5).length;
  let h=`<div class="top"><div><b>${ids.length}</b> items learned, <b>${n5}</b> at level 5</div><button id="revAll" class="pri" ${ids.length?'':'disabled'}>Review all learned</button></div>
  <p class="note">Learn a lesson, then review it. Got it = +1 level, Missed = −1 (−2 from level 4 up). Low-level items show up most often. Get every item in a lesson to level 5 to unlock the next one.</p>`;
  if(msg){h+=`<div class="msg">${esc(msg)}</div>`;msg=''}
  ['Hiragana','Katakana'].forEach(ch=>{
    h+=`<h2>${ch}</h2><div class="grid">`;
    LS.filter(l=>l.ch===ch).forEach(l=>{
      const s=stOf(l),n5=l.ids.filter(id=>lv(id)===5).length,sum=l.ids.reduce((a,id)=>a+lv(id),0);
      const sub=s==='locked'?'Locked':s==='new'?'Start lesson':s==='done'?'Mastered':`${n5}/${l.ids.length} at level 5`;
      h+=`<button class="lt ${s}" data-i="${l.i}" ${s==='locked'?'disabled title="Get every item in the previous lesson to level 5"':''}><span class="ln">Lesson ${l.i+1}</span><b>${esc(l.t)}</b><span class="lk">${esc(l.ids.slice(0,4).join(' '))}${l.ids.length>4?'…':''}</span><span class="lp"><i style="width:${sum/(5*l.ids.length)*100}%"></i></span><small>${sub}</small></button>`;
    });
    h+='</div>';
  });
  h+=`<div class="foot"><button id="rst">Reset everything</button></div>
  <p class="note">Progress saves automatically in this browser. Use "Save progress" at the top to download a backup file, and "Load progress" to restore it.</p>`;
  L.innerHTML=h;
  L.querySelectorAll('.lt').forEach(b=>b.onclick=()=>renderDetail(+b.dataset.i));
  $('revAll').onclick=()=>startReview('all');
  $('rst').onclick=()=>{if(confirm('Erase all lesson progress?')){P={u:0,l:{}};save();msg='Progress reset.';renderMap()}};
}
function renderDetail(i){
  mode='detail';cur=i;tab='lessons';layout();
  const l=LS[i],n=l.ids.length,unseen=l.ids.filter(id=>!lv(id)),n5=l.ids.filter(id=>lv(id)===5).length;
  let h=`<div class="dh"><button id="bk">‹ Back</button><span><b>${n5}/${n}</b> items at level 5</span></div>`;
  if(msg){h+=`<div class="msg">${esc(msg)}</div>`;msg=''}
  h+=`<h2>Lesson ${i+1}: ${esc(l.t)}</h2><div class="items">`+l.ids.map(id=>{const v=lv(id);
    return `<div class="it${v?'':' new'}"><span class="k${id.length>3?' s':''}">${esc(id)}</span>${v?`<div class="seg">${[1,2,3,4,5].map(x=>`<i class="${x<=v?'on':''}"></i>`).join('')}</div>`:'<small>New</small>'}</div>`}).join('')+'</div>';
  h+=`<div class="acts">${unseen.length?`<button id="ln" class="pri">Learn ${unseen.length} new item${unseen.length>1?'s':''}</button>`:''}${unseen.length<n?`<button id="rv" class="${unseen.length?'':'pri'}">Review this lesson</button>`:''}<button id="kn">I already know these</button></div>`;
  L.innerHTML=h;
  $('bk').onclick=renderMap;
  if($('ln'))$('ln').onclick=()=>startLearn(i);

}
function exitStage(){scope==='all'?renderMap():renderDetail(scope)}

function startLearn(i){
  mode='learn';cur=i;items=LS[i].ids.filter(id=>!lv(id));li=0;pending=false;layout();showLearn();
}
function showLearn(){
  q=[ALL[items[li]]];renderCurrent();
  card.style.transition='none';setFlip(true);void card.offsetWidth;card.style.transition='';
  $('count').textContent=`Lesson ${cur+1}: item ${li+1} of ${items.length}`;
  $('fill').style.width=li/items.length*100+'%';updateBtns();
}
function learnNext(){
  if(li<items.length-1){li++;showLearn();return}
  items.forEach(id=>P.l[id]=1);unlockCheck();save();
  msg=`Learned ${items.length} new item${items.length>1?'s':''}. Now review them to raise each one to level 5.`;
  renderDetail(cur);
}
function startReview(sc){
  scope=sc;mode='review';stats={ok:0,no:0};last='';layout();nextRev();
}
function nextRev(){
  pending=false;
  const ids=scope==='all'?Object.keys(P.l).filter(id=>ALL[id]):LS[scope].ids,pool=ids.filter(lv);
  if(!pool.length){msg='Nothing to review yet. Learn a lesson first.';return exitStage()}
  const w=pool.map(id=>id===last&&pool.length>1?0:Math.pow(6-lv(id),2));
  let r=Math.random()*w.reduce((a,b)=>a+b,0),k=0;
  for(;k<w.length-1;k++){r-=w[k];if(r<0)break}
  last=pool[k];q=[ALL[last]];renderCurrent();
  $('count').textContent=`${stats.ok} correct, ${stats.no} missed`;
  $('fill').style.width=ids.reduce((a,id)=>a+lv(id),0)/(5*ids.length)*100+'%';
  updateBtns();
}
function grade(ok){
  const id=q[0].k,o=lv(id);
  P.l[id]=ok?Math.min(5,o+1):Math.max(1,o-(o>=4?2:1));
  ok?stats.ok++:stats.no++;
  const unlocked=unlockCheck();save();
  if(scope!=='all'&&mastered(LS[scope])){
    msg=`Lesson ${scope+1} mastered!`+(scope<LS.length-1?` Lesson ${scope+2} is unlocked.`:' That was the last lesson.');
    return renderDetail(scope)}
  if(unlocked&&scope==='all')msg=`Lesson ${P.u+1} unlocked!`;
  if(ok)nextRev();else{pending=true;setFlip(true);updateBtns()}
}

function conv(s,alt){

  for(const c of ch){
    if(c==='っ'){dbl=true;continue}
    if(c==='ー'){const l=out[out.length-1]||'';out.push(/[aiueo]$/.test(l)?l.slice(-1):'');continue}
    if(SMY[c]){let p=out.pop()||'';p=/(sh|ch|j)i$/.test(p)?p.slice(0,-1):p.slice(0,-1)+'y';out.push(p+SMY[c]);continue}
    if(SMV[c]){const v=SMV[c];let p=out.pop()||'';
      if(/(sh|ch|j)i$/.test(p))p=p.slice(0,-1)+v;
      else if(p==='fu')p='f'+v;else if(p==='tsu')p='ts'+v;else if(p==='vu')p='v'+v;else if(p==='u')p='w'+v;
      else if((p==='te'||p==='de')&&v==='i')p=p[0]+'i';
      else if((p==='to'||p==='do')&&v==='u')p=p[0]+'wu';
      else p=p.slice(0,-1)+v;
      out.push(p);continue}
    let r=(alt&&ALT[c])||RB[c]||c;
    if(dbl){r=(r.startsWith('ch')?'t':r[0])+r;dbl=false}
    out.push(r);
  }

}

    info=`<div class="lr-img" id="lrImg" style="background-image:url('${c.img}')"></div><div class="lr-card"><div class="lr-h">How to pronounce ${esc(c.k)}</div><div class="lr-t">${esc(pr)}</div></div>${rm?`<div class="lr-card"><div class="lr-h">How to remember ${esc(c.k)}</div><div class="lr-t">${esc(rm)}</div></div>`:''}`;
  }else info=`<div class="lr-card"><div class="lr-t">${esc(c.n||'')}</div></div>`;
  body.innerHTML=`<div class="lr-card lr-top"><div class="lr-kana${[...c.k].length>1?' s':''}">${esc(c.k)}</div><div><div class="lr-rom">${esc(c.r)}</div></div></div>${info}${tr?`<div class="lr-card"><div class="lr-trw"><div class="lr-trh"><div class="lr-h">PRACTICE WRITING ${esc(c.k)}</div><span class="lr-badge" id="lrBadge"></span></div><div id="lrTr"></div></div></div>`:''}`;
  const badge=$('lrBadge'),upd=()=>{badge.className='lr-badge'+(left?'':' ok');badge.innerHTML=left||CHECK};
  if(tr)upd();
  if(c.img){const p=new Image();p.referrerPolicy='no-referrer';p.onload=()=>{const el=$('lrImg');if(el)el.style.aspectRatio=(p.naturalWidth/2)+'/'+p.naturalHeight};p.onerror=()=>{const el=$('lrImg');if(el)el.outerHTML='<div class="note">Mnemonic image could not load. Open the file in your browser to see it.</div>'};p.src=c.img}
  if(tr)trace($('lrTr'),c.k,()=>{if(left){left--;upd()}});
}
function quizPage(body,pg){
  let items=pg.items.slice(),i=0,ok=0,miss=[],checked=false;
  const show=()=>{
    if(i>=items.length){
      body.innerHTML=`<div class="lr-card"><div class="lr-h">${esc(pg.title)}</div><div class="lr-rom">${ok} / ${items.length} correct</div>${miss.length?`<p class="note">To review:</p><p>${miss.map(m=>`${esc(m.k)} = ${esc(conv(m.k))}`).join('<br>')}</p>`:'<p>Perfect! Tap Next to continue.</p>'}<div class="lr-btns">${miss.length?'<button id="lrRetry" class="pri">Retry missed</button>':''}<button id="lrAgain">Start over</button></div></div>`;
      if(miss.length)$('lrRetry').onclick=()=>{items=miss.slice();i=0;ok=0;miss=[];show()};
      $('lrAgain').onclick=()=>{items=pg.items.slice();i=0;ok=0;miss=[];show()};return}
    const it=items[i];checked=false;
    body.innerHTML=`<div class="lr-card lr-q"><div class="lr-h">${esc(pg.title)}</div><div class="note">${i+1} / ${items.length}. What's the reading? Write in romaji.</div><div class="lr-qk${[...it.k].length>3?' long':''}">${esc(it.k)}</div>${it.hint?`<div class="note" style="text-align:center">${esc(it.hint)}</div>`:''}<input id="lrIn" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Type the romaji"><div class="lr-fb" id="lrFb"></div><div class="lr-btns"><button id="lrShow">Show answer</button><button id="lrGo" class="pri">Check</button></div></div>`;
    const inp=$('lrIn'),fb=$('lrFb'),go=$('lrGo');
    const exp=conv(it.k),alt=conv(it.k,true),expTxt=alt!==exp?`${exp} (type ${alt})`:exp;
    const finish=good=>{checked=true;if(good)ok++;else miss.push(it);go.textContent=i<items.length-1?'Next':'Finish';$('lrShow').hidden=true;inp.readOnly=true};
    const doCheck=()=>{
      if(checked){i++;show();return}
      const v=inp.value.trim();if(!v){inp.focus();return}
      if(readOK(v,it.k)){fb.className='lr-fb good';fb.textContent='✓ Correct: '+expTxt;finish(true)}
      else{fb.className='lr-fb bad';fb.textContent='✗ The reading is: '+expTxt;finish(false)}
    };
    go.onclick=doCheck;
    $('lrShow').onclick=()=>{fb.className='lr-fb bad';fb.textContent='The reading is: '+expTxt;finish(false)};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doCheck()}});
    inp.focus({preventScroll:true});
  };
  show();
}

// ---------- save / load ----------
$('saveBtn').onclick=()=>{
  const out={app:'tofugu-kana',version:2,savedAt:new Date().toISOString(),u:P.u,l:P.l,learn:BP};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
  a.download='kana-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
};
$('loadBtn').onclick=()=>$('fi').click();
$('fi').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d.l!=='object')throw 0;
      const l={};let n=0;
      for(const [id,v] of Object.entries(d.l)){if(ALL[id]&&v>=1&&v<=5){l[id]=v|0;n++}}
      P={u:Math.max(0,Math.min(LS.length-1,d.u|0)),l};unlockCheck();save();if(d.learn&&typeof d.learn==='object'){Object.assign(BP,d.learn);if(BP.b)bk=BP.b;saveBP()}
      msg=`Progress loaded: ${n} items restored.`;renderMap();
    }catch(x){alert("That file isn't a valid progress save.")}
  };
  r.readAsText(f);
};

// ---------- controls ----------
const onMiss=()=>{if(mode==='fc')missed();else if(mode==='review'&&!pending)grade(false)};
const onGot=()=>{if(mode==='fc')got();else if(mode==='learn')learnNext();else if(mode==='review')pending?nextRev():grade(true)};
const onFlip=()=>{if(mode==='review'&&pending)nextRev();else if(q.length)setFlip(!flipped)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(t==='fc'){tab='fc';layout();start()}else if(t==='book')renderBook();else renderMap()});
$('back').onclick=()=>{mode==='learn'?renderDetail(cur):exitStage()};
sel.onchange=start;$('restart').onclick=start;
card.onclick=()=>{if(q.length)setFlip(!flipped)};$('flip').onclick=onFlip;$('miss').onclick=onMiss;$('got').onclick=onGot;
document.addEventListener('keydown',e=>{
  if(!['fc','learn','review'].includes(mode)||e.target===sel)return;
  if((e.key===' '||e.key==='Enter')&&e.target.tagName==='BUTTON')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();onFlip()}
  else if(e.key==='ArrowLeft')onMiss();
  else if(e.key==='ArrowRight')onGot();
});
renderMap();
</script>
